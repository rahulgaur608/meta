[project]
name = "meta"
version = "0.1.0"
description = "SQL Query Optimization Environment for OpenEnv"
authors = [
    { name = "Rahul Gaur", email = "rahulgaur608@gmail.com" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "sqlite3-api>=0.1.0",
    "openenv-core>=0.2.0",
    "python-multipart>=0.0.6",
]
requires-python = ">=3.10"

[project.scripts]
server = "app:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]
